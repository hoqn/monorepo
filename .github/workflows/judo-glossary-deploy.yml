# packages/judo-glossary 변경이 main에 반영될 때(머지/직접 푸시) 또는 Actions에서
# 수동 실행 시 GitHub Pages로 빌드·배포
name: judo-glossary — GitHub Pages build & deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/judo-glossary/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/judo-glossary
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/judo-glossary/dist

      - id: deployment
        uses: actions/deploy-pages@v4
